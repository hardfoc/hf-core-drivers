<title id="umbrella-title">One umbrella, one submodule per chip</title>
<desc id="umbrella-desc">Layer diagram: board HALs and products build on hf-core, whose handlers use the device drivers in hf-core-drivers/external and the platform layer in hf-core-drivers/internal, which drive the chips.</desc>
