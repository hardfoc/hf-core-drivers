<text x="32" y="85.6" font-size="32" font-weight="700" fill="#17202C">One umbrella, one submodule per chip</text>
<text x="32" y="115.4" font-size="18" fill="#566070">23 device drivers and 2 platform repositories, pinned together and built by hf-core.</text>
